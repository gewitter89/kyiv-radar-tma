<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Київ Радар — Оренда 0%</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: {
                            950: '#07090e',
                            900: '#0e121a',
                            850: '#151b26',
                            800: '#1d2433'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #07090e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #07090e;
        }

        /* Glass Panels */
        .glass-panel {
            background: rgba(14, 18, 26, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Bird Kyiv Map Marker Pins */
        .bird-pin-wrap {
            background: none !important;
            border: none !important;
        }
        .bird-pin {
            position: relative;
            background: #ffffff;
            color: #07090e;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1.5px solid #2563eb;
            display: flex;
            align-items: center;
            gap: 4px;
            transform: translate(-50%, -50%);
        }
        .bird-pin.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #ffffff;
            transform: translate(-50%, -50%) scale(1.18);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.6);
            z-index: 9999 !important;
        }
        .bird-pin .pin-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }
        .bird-pin.active .pin-dot {
            background: #ffffff;
        }

        /* Snap Carousel for Floating Apartment Cards */
        .cards-carousel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            padding: 0 16px 12px 16px;
        }
        .cards-carousel::-webkit-scrollbar {
            display: none;
        }
        .apartment-card {
            flex: 0 0 calc(100vw - 40px);
            max-width: 360px;
            scroll-snap-align: center;
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .apartment-card.active-card {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        /* Filter Pills Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="relative h-full w-full">

    <!-- FULLSCREEN MAP -->
    <div id="map"></div>

    <!-- TOP FLOATING GLASS ISLAND -->
    <header class="absolute top-3 left-3 right-3 z-30 flex flex-col gap-2 pointer-events-none">
        <!-- Main Search Bar + Filter Trigger -->
        <div class="glass-panel rounded-2xl p-2 px-3 flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
            <!-- Brand -->
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 rounded-xl bg-white text-base-950 flex items-center justify-center font-black text-xs shrink-0 shadow-sm">
                    КР
                </div>
                <div class="min-w-0 pr-1">
                    <div class="flex items-center gap-1">
                        <span class="text-xs font-black text-white tracking-tight">Київ Радар</span>
                        <span class="px-1 py-0.5 rounded text-[8px] font-extrabold bg-emerald-500/20 text-emerald-300">0%</span>
                    </div>
                    <span class="text-[9px] text-slate-400 font-medium block truncate">Прямі власники</span>
                </div>
            </div>

            <!-- Search Input -->
            <div class="flex-1 relative flex items-center min-w-0">
                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                </svg>
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Метро, район, ЖК…" class="w-full bg-base-900/90 border border-white/10 rounded-xl pl-8 pr-2.5 py-1.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-white/30 transition-all">
            </div>

            <!-- Filter Trigger Button -->
            <button onclick="openFilterModal()" class="shrink-0 px-2.5 py-1.5 rounded-xl bg-base-850 hover:bg-base-800 text-slate-200 border border-white/10 transition-all active:scale-95 flex items-center gap-1 text-xs font-bold shadow-sm">
                <svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M7 10h10M11 16h2"/>
                </svg>
                <span class="text-[11px] whitespace-nowrap">Опції</span>
            </button>
        </div>

        <!-- 3 Solid Full-Width Toggles (100% Fit, Zero Ellipsis, Zero Clipping) -->
        <div class="pointer-events-auto w-full">
            <div class="grid grid-cols-3 gap-1.5 w-full">
                <button onclick="toggleQuickFilter(this, 'all')" class="q-filter active py-1.5 px-2 rounded-xl text-xs font-bold bg-white text-base-950 text-center shadow-md whitespace-nowrap transition-all">
                    Всі (4)
                </button>
                <button onclick="toggleQuickFilter(this, 'generator')" class="q-filter py-1.5 px-2 rounded-xl text-xs font-semibold glass-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    🔋 Генератор
                </button>
                <button onclick="toggleQuickFilter(this, 'gpon')" class="q-filter py-1.5 px-2 rounded-xl text-xs font-semibold glass-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    ⚡ GPON
                </button>
            </div>
        </div>
    </header>

    <!-- FLOATING MAP CONTROLS (Right Side) -->
    <div class="absolute right-3 top-32 z-20 flex flex-col gap-2">
        <button onclick="recenterKyiv()" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all" title="Центр Києва">
            <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
            </svg>
        </button>
        <button onclick="zoomMap(1)" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all text-sm font-bold leading-none">
            +
        </button>
        <button onclick="zoomMap(-1)" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all text-sm font-bold leading-none">
            −
        </button>
    </div>

    <!-- BOTTOM FLOATING BIRD DECK (Snap Horizontal Carousel) -->
    <div class="absolute bottom-3 left-0 right-0 z-30">
        <div class="cards-carousel" id="cardsCarousel">
            <!-- Rendered by JavaScript -->
        </div>
    </div>

    <!-- FULL DETAIL MODAL / SHEET -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end">
        <div class="w-full max-h-[90vh] bg-base-900 border-t border-white/10 rounded-t-3xl overflow-y-auto p-5 space-y-4 text-white transform translate-y-full transition-transform duration-300" id="detailSheetContent">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- ADVANCED FILTER MODAL -->
    <div id="filterModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end">
        <div class="w-full max-h-[85vh] bg-base-900 border-t border-white/10 rounded-t-3xl overflow-y-auto p-5 space-y-4 text-white transform translate-y-full transition-transform duration-300" id="filterSheetContent">
            <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-2"></div>
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h3 class="text-base font-extrabold">Фільтри оренди</h3>
                <button onclick="closeFilterModal()" class="text-xs font-bold text-slate-400 hover:text-white">Закрити ✕</button>
            </div>
            
            <!-- Districts -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Район</label>
                <div class="grid grid-cols-2 gap-2 text-xs" id="districtButtons">
                    <button onclick="selectDistrict(this, 'Оболонь')" class="dist-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold">Оболонський</button>
                    <button onclick="selectDistrict(this, 'Поділ')" class="dist-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold">Подільський</button>
                    <button onclick="selectDistrict(this, 'Печерськ')" class="dist-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold">Печерський</button>
                    <button onclick="selectDistrict(this, 'Голосієво')" class="dist-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold">Голосіївський</button>
                </div>
            </div>

            <!-- Price Range -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Бюджет (грн/міс)</label>
                <div class="flex gap-2">
                    <input type="number" id="filterMinPrice" placeholder="Від 8 000" class="w-full bg-base-850 border border-white/5 rounded-xl p-2.5 text-xs text-white">
                    <input type="number" id="filterMaxPrice" placeholder="До 35 000" class="w-full bg-base-850 border border-white/5 rounded-xl p-2.5 text-xs text-white">
                </div>
            </div>

            <!-- Extra Options -->
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Параметри житла</label>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="toggleModalOption(this, 'lowFloor')" id="opt-lowFloor" class="opt-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold text-slate-300">🏢 Поверх 1–5</button>
                    <button type="button" onclick="toggleModalOption(this, 'pets')" id="opt-pets" class="opt-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold text-slate-300">🐾 З тваринами</button>
                    <button type="button" onclick="toggleModalOption(this, 'gas')" id="opt-gas" class="opt-btn p-2.5 rounded-xl bg-base-850 border border-white/5 text-left font-semibold text-slate-300">🔥 Газ</button>
                </div>
            </div>

            <!-- Submit -->
            <button onclick="applyModalFilters()" class="w-full py-3 rounded-xl bg-white text-base-950 font-black text-xs shadow-lg active:scale-98 transition-all">
                Показати варіанти
            </button>
        </div>
    </div>

    <script>
        // Telegram WebApp Integration
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#07090e');
            tg.setBackgroundColor('#07090e');
        }

        function triggerHaptic(type = 'light') {
            if (tg?.HapticFeedback) {
                if (type === 'selection') tg.HapticFeedback.selectionChanged();
                else tg.HapticFeedback.impactOccurred(type);
            }
        }

        // Real Kyiv Properties Dataset
        const LISTINGS = [
            {
                id: 1,
                title: "1к біля парку Наталка та набережної",
                district: "Оболонь",
                address: "Оболонська набережна, 14",
                metro: "М Мінська",
                metroColor: "#3b82f6",
                walkMin: 7,
                price: 14500,
                area: 44,
                floor: 4,
                totalFloors: 9,
                lat: 50.5050,
                lng: 30.5180,
                gpon: true,
                generator: false,
                gas: false,
                lowFloor: true,
                pets: true,
                realtorCommissionSaved: 7250,
                ownerName: "Сергій Олександрович",
                note: "Оптоволокно підключено, роутер заживлений від mini-UPS. Показую сьогодні після 18:30.",
                images: [
                    "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=800&auto=format&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1484154218962-a197022b5858?w=800&auto=format&fit=crop&q=80"
                ]
            },
            {
                id: 2,
                title: "2к сталінка з газовою колонкою на Подолі",
                district: "Поділ",
                address: "вул. Ярославська, 15",
                metro: "М Контрактова площа",
                metroColor: "#3b82f6",
                walkMin: 4,
                price: 17000,
                area: 56,
                floor: 3,
                totalFloors: 5,
                lat: 50.4680,
                lng: 30.5120,
                gpon: true,
                generator: false,
                gas: true,
                lowFloor: true,
                pets: false,
                realtorCommissionSaved: 8500,
                ownerName: "Олена Миколаївна",
                note: "Товсті цегляні стіни, гаряча вода є завжди через газову колонку. Тихий зелений двір.",
                images: [
                    "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&auto=format&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=800&auto=format&fit=crop&q=80"
                ]
            },
            {
                id: 3,
                title: "Євродвушка в ЖК «Французький Квартал 2»",
                district: "Печерськ",
                address: "вул. Предславинська, 55",
                metro: "М Либідська",
                metroColor: "#3b82f6",
                walkMin: 5,
                price: 25000,
                area: 52,
                floor: 6,
                totalFloors: 16,
                lat: 50.4180,
                lng: 30.5280,
                gpon: true,
                generator: true,
                gas: false,
                lowFloor: false,
                pets: true,
                realtorCommissionSaved: 12500,
                ownerName: "Андрій (власник)",
                note: "ЖК бізнес-класу з власним генератором на ліфти, воду та опалення. Закрита охорона 24/7.",
                images: [
                    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800&auto=format&fit=crop&q=80"
                ]
            },
            {
                id: 4,
                title: "Затишна 1к біля парку Рильського",
                district: "Голосієво",
                address: "вул. Васильківська, 34",
                metro: "М Васильківська",
                metroColor: "#3b82f6",
                walkMin: 3,
                price: 12500,
                area: 39,
                floor: 5,
                totalFloors: 9,
                lat: 50.3930,
                lng: 30.4910,
                gpon: true,
                generator: false,
                gas: true,
                lowFloor: true,
                pets: true,
                realtorCommissionSaved: 6250,
                ownerName: "Марія Василівна",
                note: "Паркова зона, свіже повітря. Газова плита, пральна машина, бойлер. Без комісії рієлтора.",
                images: [
                    "https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=800&auto=format&fit=crop&q=80",
                    "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800&auto=format&fit=crop&q=80"
                ]
            }
        ];

        // Active State
        let currentFilter = {
            search: '',
            district: 'all',
            generator: false,
            gpon: false,
            lowFloor: false,
            pets: false,
            gas: false,
            minPrice: null,
            maxPrice: null
        };

        let currentActiveIndex = 0;
        let mapMarkers = {};

        // INITIALIZE MAP LOCKED TO KYIV
        const KYIV_BOUNDS = L.latLngBounds(
            L.latLng(50.213, 30.239),
            L.latLng(50.591, 30.825)
        );

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            minZoom: 11,
            maxZoom: 17,
            maxBounds: KYIV_BOUNDS,
            maxBoundsViscosity: 1.0,
            touchZoom: true
        }).setView([50.4501, 30.5234], 12);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            minZoom: 11, maxZoom: 17
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
            minZoom: 11, maxZoom: 17
        }).addTo(map);

        map.on('zoomend moveend', () => {
            if (!KYIV_BOUNDS.contains(map.getCenter())) {
                map.panInsideBounds(KYIV_BOUNDS, { animate: true });
            }
        });

        function recenterKyiv() {
            triggerHaptic('light');
            map.flyTo([50.4501, 30.5234], 12, { duration: 0.8 });
        }

        function zoomMap(delta) {
            triggerHaptic('light');
            map.setZoom(map.getZoom() + delta);
        }

        // RENDER BOTTOM CAROUSEL & PINS
        function getFilteredListings() {
            return LISTINGS.filter(item => {
                if (currentFilter.district !== 'all' && item.district !== currentFilter.district) return false;
                if (currentFilter.generator && !item.generator) return false;
                if (currentFilter.gpon && !item.gpon) return false;
                if (currentFilter.lowFloor && !item.lowFloor) return false;
                if (currentFilter.pets && !item.pets) return false;
                if (currentFilter.gas && !item.gas) return false;
                if (currentFilter.minPrice && item.price < currentFilter.minPrice) return false;
                if (currentFilter.maxPrice && item.price > currentFilter.maxPrice) return false;
                if (currentFilter.search) {
                    const q = currentFilter.search.toLowerCase();
                    const text = `${item.title} ${item.address} ${item.metro} ${item.district}`.toLowerCase();
                    if (!text.includes(q)) return false;
                }
                return true;
            });
        }

        function updateUI() {
            const filtered = getFilteredListings();
            renderMarkers(filtered);
            renderCarousel(filtered);
            if (filtered.length > 0) {
                selectCard(0, false);
            }
        }

        function renderMarkers(items) {
            Object.values(mapMarkers).forEach(m => map.removeLayer(m));
            mapMarkers = {};

            items.forEach((item, index) => {
                const label = (item.price / 1000).toFixed(1) + 'k ₴';
                const customIcon = L.divIcon({
                    className: 'bird-pin-wrap',
                    html: `
                        <div class="bird-pin ${index === currentActiveIndex ? 'active' : ''}" id="pin-${item.id}">
                            <span class="pin-dot"></span>
                            <span>${label}</span>
                        </div>
                    `,
                    iconSize: [68, 28],
                    iconAnchor: [34, 14]
                });

                const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                marker.on('click', () => {
                    selectCard(index, true);
                });
                mapMarkers[item.id] = marker;
            });
        }

        function renderCarousel(items) {
            const container = document.getElementById('cardsCarousel');
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="w-full glass-panel p-5 rounded-2xl text-center text-white">
                        <div class="text-sm font-bold">Нічого не знайдено</div>
                        <div class="text-xs text-slate-400 mt-1">Спробуйте скинути фільтри або змінити пошук.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map((item, index) => `
                <div class="apartment-card glass-panel shadow-2xl ${index === currentActiveIndex ? 'active-card' : ''}" id="card-${item.id}" onclick="selectCard(${index}, true)">
                    <!-- Photo Header with Badges -->
                    <div class="relative w-full h-36 bg-base-950 overflow-hidden cursor-pointer" onclick="openDetail(${item.id})">
                        <img src="${item.images[0]}" class="w-full h-full object-cover" alt="${item.title}">
                        
                        <!-- Top Badges -->
                        <div class="absolute top-2 left-2 flex items-center gap-1 z-10">
                            <span class="px-2 py-0.5 rounded-lg bg-base-950/80 backdrop-blur-md border border-white/10 text-[10px] font-bold text-emerald-400">
                                🟢 Власник 0%
                            </span>
                            ${item.generator ? '<span class="px-2 py-0.5 rounded-lg bg-amber-500/90 text-base-950 text-[10px] font-black">🔋 Генератор</span>' : ''}
                            ${item.gpon ? '<span class="px-2 py-0.5 rounded-lg bg-sky-500/90 text-base-950 text-[10px] font-black">⚡ GPON</span>' : ''}
                        </div>

                        <!-- Price Tag Floating -->
                        <div class="absolute bottom-2 right-2 bg-base-950/90 backdrop-blur-md px-2.5 py-1 rounded-xl border border-white/15 text-white font-black text-sm z-10 shadow-lg">
                            ${item.price.toLocaleString('uk-UA')} ₴
                        </div>

                        <!-- Photo count -->
                        <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded-md text-[9px] text-white font-mono z-10">
                            1 / ${item.images.length}
                        </div>
                    </div>

                    <!-- Card Body -->
                    <div class="p-3 space-y-2">
                        <!-- Location & Metro Pills -->
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-base-900 border border-white/10 text-[11px] font-bold text-white whitespace-nowrap">
                                <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background-color: ${item.metroColor}"></span>
                                <span>${item.metro} · ${item.walkMin} хв</span>
                            </span>
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-base-900 border border-white/5 text-[11px] text-slate-300 font-medium whitespace-nowrap">
                                ${item.district}
                            </span>
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-base-900 border border-white/5 text-[11px] text-slate-400 whitespace-nowrap">
                                ${item.area} м² · ${item.floor}/${item.totalFloors} пов.
                            </span>
                        </div>

                        <!-- Title & Address -->
                        <div class="cursor-pointer" onclick="openDetail(${item.id})">
                            <h4 class="text-xs font-bold text-white leading-tight truncate">${item.title}</h4>
                            <p class="text-[10px] text-slate-400 truncate mt-0.5">📍 ${item.address}</p>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-2 pt-1">
                            <a href="https://t.me/pavlograd_admin?text=Вітаю!+Цікавить+квартира+№${item.id}:+${encodeURIComponent(item.address)}" target="_blank" onclick="triggerHaptic('medium')" class="flex-1 py-2 rounded-xl bg-white text-base-950 font-black text-xs flex items-center justify-center gap-1 shadow-md active:scale-95 transition-all">
                                <svg class="w-3.5 h-3.5 fill-current text-sky-500" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.95-1.28 4.92-2.13 5.92-2.55 2.82-1.18 3.4-1.38 3.79-1.39.08 0 .28.02.4.12.1.08.13.2.14.28-.01.07-.01.21-.03.38z"/></svg>
                                <span>Написати власнику</span>
                            </a>
                            <button onclick="openDetail(${item.id})" class="px-3 py-2 rounded-xl bg-base-850 hover:bg-base-800 text-slate-300 font-bold text-xs border border-white/10 active:scale-95 transition-all">
                                Інфо
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            attachCarouselScrollListener(items);
        }

        // BIRD KYIV CORE MECHANIC: Swipe card -> Map flies to coordinate!
        function selectCard(index, scrollCarousel = true) {
            const items = getFilteredListings();
            if (index < 0 || index >= items.length) return;

            currentActiveIndex = index;
            const activeItem = items[index];

            // 1. Highlight map marker
            document.querySelectorAll('.bird-pin').forEach(p => p.classList.remove('active'));
            const activePin = document.getElementById(`pin-${activeItem.id}`);
            if (activePin) activePin.classList.add('active');

            // 2. Fly map to coordinates (smooth Bird Kyiv cinematic flyTo)
            map.flyTo([activeItem.lat, activeItem.lng], 14.5, {
                duration: 0.7,
                easeLinearity: 0.25
            });

            // 3. Highlight card in carousel
            document.querySelectorAll('.apartment-card').forEach(c => c.classList.remove('active-card'));
            const activeCard = document.getElementById(`card-${activeItem.id}`);
            if (activeCard) {
                activeCard.classList.add('active-card');
                if (scrollCarousel) {
                    activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }

            triggerHaptic('selection');
        }

        // Detect user horizontal swipe in carousel
        let scrollTimeout;
        function attachCarouselScrollListener(items) {
            const carousel = document.getElementById('cardsCarousel');
            carousel.onscroll = () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const cards = Array.from(carousel.children);
                    const carouselCenter = carousel.scrollLeft + (carousel.offsetWidth / 2);
                    
                    let closestIndex = 0;
                    let minDiff = Infinity;

                    cards.forEach((c, idx) => {
                        const cardCenter = c.offsetLeft + (c.offsetWidth / 2);
                        const diff = Math.abs(carouselCenter - cardCenter);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIndex = idx;
                        }
                    });

                    if (closestIndex !== currentActiveIndex && closestIndex < items.length) {
                        selectCard(closestIndex, false);
                    }
                }, 80);
            };
        }

        // QUICK FILTER CLICKS
        function toggleQuickFilter(btn, type) {
            triggerHaptic('light');
            document.querySelectorAll('.q-filter').forEach(b => {
                b.className = 'q-filter shrink-0 px-3 py-1 rounded-full text-xs font-semibold glass-panel text-slate-300 hover:text-white transition-all';
            });
            btn.className = 'q-filter active shrink-0 px-3 py-1 rounded-full text-xs font-bold bg-white text-base-950 shadow-md';

            if (type === 'all') {
                currentFilter = { ...currentFilter, generator: false, gpon: false, lowFloor: false, pets: false, gas: false };
            } else {
                currentFilter = { ...currentFilter, generator: false, gpon: false, lowFloor: false, pets: false, gas: false };
                currentFilter[type] = true;
            }
            updateUI();
        }

        function handleSearch(val) {
            currentFilter.search = val.trim();
            updateUI();
        }

        // DETAIL SHEET MODAL
        function openDetail(id) {
            triggerHaptic('medium');
            const item = LISTINGS.find(x => x.id === id);
            if (!item) return;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailSheetContent');

            content.innerHTML = `
                <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-3"></div>
                
                <!-- Photos -->
                <div class="w-full aspect-[16/10] rounded-2xl overflow-hidden bg-base-950">
                    <img src="${item.images[0]}" class="w-full h-full object-cover">
                </div>

                <!-- Price & Commission -->
                <div class="flex items-center justify-between pt-2">
                    <div>
                        <div class="text-xl font-black text-white">${item.price.toLocaleString('uk-UA')} ₴ / міс</div>
                        <div class="text-xs text-emerald-400 font-bold">✓ 0% Комісії рієлтора (економія +${item.realtorCommissionSaved.toLocaleString('uk-UA')} ₴)</div>
                    </div>
                    <button onclick="closeDetail()" class="p-2 rounded-xl bg-base-850 text-slate-400 hover:text-white font-bold text-xs">✕</button>
                </div>

                <!-- Details -->
                <div class="space-y-1">
                    <h3 class="text-sm font-extrabold text-white">${item.title}</h3>
                    <div class="text-xs text-slate-400">📍 ${item.address} • ${item.metro} (${item.walkMin} хв)</div>
                </div>

                <!-- Blackout / Winter Perks -->
                <div class="p-3.5 rounded-2xl bg-base-850 border border-white/5 space-y-2">
                    <div class="text-xs font-bold text-slate-300">Готовність до зими:</div>
                    <div class="flex flex-wrap gap-2 text-xs">
                        <span class="px-2.5 py-1 rounded-lg ${item.gpon ? 'bg-emerald-500/20 text-emerald-300 font-bold' : 'bg-base-900 text-slate-500'}">
                            ${item.gpon ? '⚡ Оптоволокно GPON є' : '✕ Без GPON'}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg ${item.generator ? 'bg-amber-500/20 text-amber-300 font-bold' : 'bg-base-900 text-slate-500'}">
                            ${item.generator ? '🔋 Генератор у ЖК' : '✕ Без генератора'}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg ${item.gas ? 'bg-sky-500/20 text-sky-300 font-bold' : 'bg-base-900 text-slate-500'}">
                            ${item.gas ? '🔥 Газ є' : '✕ Електроплита'}
                        </span>
                    </div>
                </div>

                <!-- Direct Owner Verification -->
                <div class="p-3.5 rounded-2xl bg-base-850 border border-white/5 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-bold text-white">${item.ownerName}</span>
                        <span class="text-emerald-400 font-bold">✓ Перевірений власник</span>
                    </div>
                    <p class="text-xs text-slate-300 italic">«${item.note}»</p>
                </div>

                <!-- Action Button -->
                <a href="https://t.me/pavlograd_admin?text=Вітаю!+Цікавить+квартира+№${item.id}:+${encodeURIComponent(item.address)}" target="_blank" onclick="triggerHaptic('heavy')" class="w-full py-3.5 rounded-2xl bg-white text-base-950 font-black text-sm flex items-center justify-center gap-2 shadow-xl active:scale-98 transition-all">
                    💬 Написати господарю в Telegram
                </a>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeDetail() {
            triggerHaptic('light');
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailSheetContent');
            content.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // FILTER MODAL
        function openFilterModal() {
            triggerHaptic('medium');
            const modal = document.getElementById('filterModal');
            const content = document.getElementById('filterSheetContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeFilterModal() {
            triggerHaptic('light');
            const modal = document.getElementById('filterModal');
            const content = document.getElementById('filterSheetContent');
            content.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function selectDistrict(btn, dist) {
            triggerHaptic('light');
            document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('bg-white', 'text-base-950', 'font-black'));
            btn.classList.add('bg-white', 'text-base-950', 'font-black');
            currentFilter.district = dist;
        }

        function toggleModalOption(btn, opt) {
            triggerHaptic('light');
            currentFilter[opt] = !currentFilter[opt];
            if (currentFilter[opt]) {
                btn.classList.add('bg-white', 'text-base-950', 'font-black');
                btn.classList.remove('bg-base-850', 'text-slate-300');
            } else {
                btn.classList.remove('bg-white', 'text-base-950', 'font-black');
                btn.classList.add('bg-base-850', 'text-slate-300');
            }
        }

        function applyModalFilters() {
            triggerHaptic('medium');
            const min = parseInt(document.getElementById('filterMinPrice').value);
            const max = parseInt(document.getElementById('filterMaxPrice').value);
            currentFilter.minPrice = isNaN(min) ? null : min;
            currentFilter.maxPrice = isNaN(max) ? null : max;
            closeFilterModal();
            updateUI();
        }

        // INITIAL LOAD
        updateUI();
    </script>
</body>
</html>
