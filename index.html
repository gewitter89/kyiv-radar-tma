<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Київ Радар — Оренда квартир без комісії 50%</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#0b0c10',
                            900: '#13151f',
                            850: '#1a1d2b',
                            800: '#232738',
                            700: '#32374d'
                        },
                        brand: {
                            blue: '#007aff',
                            green: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Modern Leaflet Tile Adjustments */
        .leaflet-container {
            background: #0b0c10 !important;
            font-family: inherit;
        }
        .leaflet-control-zoom, .leaflet-control-attribution {
            display: none !important;
        }

        /* Price Pin Markers (Airbnb / Bird Kyiv Style) */
        .bird-pin-wrap {
            background: transparent !important;
            border: none !important;
        }
        .bird-pin {
            background: #111827;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .bird-pin:hover, .bird-pin.active {
            background: #10b981;
            border-color: #ffffff;
            color: #0b0c10;
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.6);
            z-index: 1000 !important;
        }
        .bird-pin .pin-dot {
            width: 5px;
            height: 5px;
            border-radius: 9999px;
            background: #10b981;
            flex-shrink: 0;
        }
        .bird-pin.active .pin-dot {
            background: #0b0c10;
        }
        .bird-pin:hover {
            transform: scale(1.12);
            background: #007aff;
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.55), 0 0 0 1.5px #ffffff;
            z-index: 1000 !important;
        }
        .bird-pin.active {
            background: #007aff;
            transform: scale(1.15);
            box-shadow: 0 6px 22px rgba(0, 122, 255, 0.7), 0 0 0 2px #ffffff;
            z-index: 1001 !important;
        }
        .bird-pin .pin-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #10b981;
        }
        .bird-pin.active .pin-dot {
            background: #ffffff;
        }
        .bird-pin .pin-badge {
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            font-weight: 700;
        }

        /* Pulsing GPS Dot */
        .user-loc-wrap { background: transparent !important; border: none !important; }
        .user-loc-container {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
        }
        .user-loc-dot {
            width: 14px;
            height: 14px;
            background: #007aff;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(0, 122, 255, 0.95);
            z-index: 2;
        }
        .user-loc-pulse {
            position: absolute;
            top: 50%; left: 50%;
            width: 44px; height: 44px;
            margin-left: -22px; margin-top: -22px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.35);
            animation: locPulse 2s infinite cubic-bezier(0.2, 0.6, 0.35, 1);
            z-index: 1;
            pointer-events: none;
        }
        @keyframes locPulse {
            0% { transform: scale(0.35); opacity: 0.9; }
            70% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Subtle scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Card active highlight */
        .card-active-ring {
            box-shadow: 0 0 0 2px #007aff, 0 12px 36px rgba(0,0,0,0.85) !important;
            border-color: #007aff !important;
        }

        /* Glass Surface Panels */
        .glass-panel {
            background: rgba(19, 21, 31, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
            /* MarkerCluster Custom Theme for Kyiv Radar */
        .custom-cluster-wrap {
            background: transparent !important;
            border: none !important;
        }
        .cluster-pill {
            background: #111827;
            border: 2px solid #3b82f6;
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.15);
            transition: transform 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
        }
        .cluster-pill:hover, .cluster-pill:active {
            transform: scale(1.1);
            border-color: #10b981;
        }
        .cluster-pill.sm {
            width: 36px;
            height: 36px;
            border-color: #3b82f6;
        }
        .cluster-pill.md {
            width: 42px;
            height: 42px;
            border-color: #6366f1;
        }
        .cluster-pill.lg {
            width: 48px;
            height: 48px;
            border-color: #10b981;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col bg-dark-950 select-none">

    <!-- ════════════════════════════════════════════════════════════════════
         TOP GLOBAL NAVBAR (Clean, un-crowded, responsive for PC & Mobile)
    ════════════════════════════════════════════════════════════════════ -->
    <header class="h-14 md:h-16 shrink-0 glass-panel border-b border-white/10 px-3 md:px-6 flex items-center justify-between gap-3 z-30">
        <!-- Left: Logo & City Dropdown -->
        <div class="flex items-center gap-3 shrink-0">
            <div class="w-9 h-9 rounded-xl bg-white text-dark-950 font-black text-sm flex items-center justify-center shadow-md">
                КР
            </div>
            <!-- City Selector Trigger -->
            <button onclick="openCityDrawer()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-dark-850 hover:bg-dark-800 border border-white/10 text-xs font-bold text-white transition-all active:scale-95 shadow-sm">
                <span id="headerCityTitle">Київ</span>
                <span class="px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-extrabold">0%</span>
                <svg class="w-3 h-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
            </button>
        </div>

        <!-- Center: Search Input (Expands smoothly) -->
        <div class="flex-1 max-w-xl relative flex items-center">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
            </svg>
            <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Пошук: метро, район, ЖК, вулиця..." class="w-full bg-dark-900 border border-white/10 rounded-xl pl-9 pr-8 py-2 text-xs md:text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-brand-blue transition-all">
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 text-slate-400 hover:text-white p-1 text-xs font-bold">✕</button>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2 shrink-0">
            <!-- District Picker button -->
            <button onclick="openDistrictDrawer()" class="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-dark-850 hover:bg-dark-800 border border-white/10 text-xs font-semibold text-slate-200 hover:text-white transition-all active:scale-95 shadow-sm">
                <svg class="w-3.5 h-3.5 text-brand-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span id="activeDistrictLabel">Район</span>
            </button>

            <!-- Landlord Submit Fast Action -->
            <button onclick="openLandlordDrawer()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 font-bold text-xs transition-all active:scale-95 shadow-sm">
                <span>🏢</span>
                <span class="hidden md:inline">Здати житло 0%</span>
                <span class="md:hidden">Здати 0%</span>
            </button>
        </div>
    </header>

    <!-- ════════════════════════════════════════════════════════════════════
         MAIN RESPONSIVE VIEWPORT
         - Desktop (>= md): True Split Screen (Left Feed + Right Map)
         - Mobile (< md): Toggleable Map / Feed with Bottom Switcher Pill
    ════════════════════════════════════════════════════════════════════ -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- ─────────────────────────────────────────────────────────────
             LEFT COLUMN: FEED / SIDEBAR
             On Desktop: Fixed width (450px - 520px), scrollable with mouse wheel!
             On Mobile: Fullscreen when mobileViewMode === 'list'
        ───────────────────────────────────────────────────────────── -->
        <aside id="feedSidebar" class="w-full md:w-[460px] lg:w-[500px] xl:w-[540px] shrink-0 h-full flex flex-col bg-dark-900 border-r border-white/10 z-30 transition-all duration-200 md:relative absolute inset-0 md:translate-x-0">
            <!-- Filter Pills Horizontal Bar (with mouse wheel support!) -->
            <div class="p-3 border-b border-white/10 bg-dark-950 shrink-0">
                <div id="filterPillsScroll" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 custom-scroll">
                    <button onclick="toggleQuickFilter(this, 'all')" id="btnFilterAll" class="q-filter active shrink-0 py-1.5 px-3 rounded-xl text-xs font-bold bg-white text-dark-950 shadow-sm transition-all">
                        Всі (150)
                    </button>
                    <button onclick="toggleQuickFilter(this, 'favs')" id="btnFilterFavs" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        🤍 Збережені
                    </button>
                    <button onclick="toggleQuickFilter(this, 'rooms_1')" id="btnFilterR1" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        1-кімн
                    </button>
                    <button onclick="toggleQuickFilter(this, 'rooms_2')" id="btnFilterR2" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        2-кімн
                    </button>
                    <button onclick="toggleQuickFilter(this, 'max_15k')" id="btnFilter15k" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        До 15k ₴
                    </button>
                    <button onclick="toggleQuickFilter(this, 'max_20k')" id="btnFilter20k" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        До 20k ₴
                    </button>
                    <button onclick="toggleQuickFilter(this, 'gpon')" id="btnFilterGpon" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        ⚡ GPON
                    </button>
                    <button onclick="toggleQuickFilter(this, 'generator')" id="btnFilterGen" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        🔋 Генератор
                    </button>
                    <button onclick="activateNearbyMode(this)" id="btnFilterNearby" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-xs font-medium bg-dark-850 text-slate-300 hover:text-white border border-white/10 transition-all">
                        📍 Поруч
                    </button>
                </div>
                <!-- Proximity / Filter summary label -->
                <div class="flex items-center justify-between pt-2 text-[11px] text-slate-400">
                    <span id="resultsCountLabel">Завантаження лотів...</span>
                    <span id="activeDistrictBadge" class="text-brand-blue font-bold truncate">Київ (всі райони)</span>
                </div>
            </div>

            <!-- Scrollable Apartment Cards List (Smooth Native Mouse Wheel on PC!) -->
            <div id="cardsList" class="flex-1 overflow-y-auto p-3 space-y-3 pb-28 md:pb-6 custom-scroll">
                <!-- Dynamically populated with rich cards -->
            </div>
        </aside>

        <!-- ─────────────────────────────────────────────────────────────
             RIGHT COLUMN: FULL-HEIGHT LEAFLET MAP
             Always visible on Desktop. Interactive and synced with cards.
        ───────────────────────────────────────────────────────────── -->
        <main id="mapContainer" class="flex-1 h-full relative overflow-hidden">
            <!-- Map Canvas -->
            <div id="map" class="w-full h-full"></div>

            <!-- Floating Map Navigation Tools -->
            <div class="absolute right-3 top-4 z-20 flex flex-col gap-2">
                <button onclick="handleLocateClick()" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all group" title="Поруч зі мною (GPS)">
                    <svg class="w-4 h-4 text-brand-blue group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
                </button>
                <button onclick="recenterKyiv()" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all group" title="Київ центр">
                    <svg class="w-4 h-4 text-slate-300 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </button>
                <button onclick="zoomMap(1)" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all text-sm font-black leading-none w-9 h-9 flex items-center justify-center">
                    +
                </button>
                <button onclick="zoomMap(-1)" class="glass-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all text-sm font-black leading-none w-9 h-9 flex items-center justify-center">
                    −
                </button>
            </div>

            <!-- Single Focused Card on Mobile (Pops up when tapping a map marker) -->
            <div id="mobileFocusedCardContainer" class="md:hidden fixed bottom-20 left-3 right-3 z-30 hidden transition-transform duration-300">
                <!-- Rendered dynamically -->
            </div>
        </main>

        <!-- ─────────────────────────────────────────────────────────────
             MOBILE BOTTOM FLOATING PILL SWITCHER: [ 📋 Список ] ⇄ [ 🗺 Карта ]
             Apple / Airbnb style: lets user flip effortlessly between map and list
        ───────────────────────────────────────────────────────────── -->
        <div class="md:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-auto">
            <button id="btnMobileViewToggle" onclick="toggleMobileView()" class="px-6 py-3 rounded-full bg-white text-dark-950 font-black text-xs uppercase tracking-wider flex items-center gap-2 shadow-[0_10px_35px_rgba(0,0,0,0.8)] ring-2 ring-white/30 active:scale-95 transition-all hover:scale-105">
                <span id="mobileViewIcon" class="text-sm">📋</span>
                <span id="mobileViewLabel">Список (150)</span>
            </button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════════
         MODALS & DRAWERS (Centered Dialogs on Desktop, Bottom Sheets on Mobile)
    ════════════════════════════════════════════════════════════════════ -->

    <!-- 1. FULL APARTMENT DETAIL MODAL -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end md:items-center justify-center p-0 md:p-4">
        <div id="detailSheetContent" class="w-full md:max-w-2xl max-h-[92vh] md:max-h-[85vh] bg-dark-900 border-t md:border border-white/10 rounded-t-3xl md:rounded-3xl overflow-y-auto p-4 md:p-6 space-y-4 text-white custom-scroll transform translate-y-full md:translate-y-0 transition-transform duration-300">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- 2. CITY SELECTOR MODAL (Kyiv, Lviv, Odesa) -->
    <div id="cityDrawer" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end md:items-center justify-center p-0 md:p-4">
        <div id="cityDrawerContent" class="w-full md:max-w-md bg-dark-900 border-t md:border border-white/10 rounded-t-3xl md:rounded-3xl p-5 space-y-4 text-white transform translate-y-full md:translate-y-0 transition-transform duration-300">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <div>
                    <h3 class="text-base font-bold text-white">🏙 Оберіть місто пошуку</h3>
                    <p class="text-[11px] text-slate-400">Прямі власники без комісії 50%</p>
                </div>
                <button onclick="closeCityDrawer()" class="text-xs font-bold text-slate-400 hover:text-white p-1">✕</button>
            </div>
            <div class="space-y-2">
                <button onclick="switchCity('kyiv', 50.4501, 30.5234, 'Київ')" class="w-full p-3.5 rounded-2xl bg-white text-dark-950 font-bold text-left flex items-center justify-between shadow-lg active:scale-98 transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🇺🇦</span>
                        <div>
                            <div class="text-sm font-extrabold">Київ Радар</div>
                            <div class="text-[11px] text-slate-600 font-semibold" id="cityKyivCount">150 перевірених квартир</div>
                        </div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-black uppercase">Активно</span>
                </button>
                <button onclick="switchCity('lviv', 49.8397, 24.0297, 'Львів')" class="w-full p-3.5 rounded-2xl bg-dark-850 border border-white/10 text-left flex items-center justify-between hover:bg-dark-800 active:scale-98 transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🦁</span>
                        <div>
                            <div class="text-sm font-bold text-white">Львів Радар</div>
                            <div class="text-[11px] text-slate-400">Запуск 1 грудня · 42 заявки на пошук</div>
                        </div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-brand-blue/20 text-brand-blue text-[10px] font-bold">Скоро</span>
                </button>
                <button onclick="switchCity('odesa', 46.4825, 30.7233, 'Одеса')" class="w-full p-3.5 rounded-2xl bg-dark-850 border border-white/10 text-left flex items-center justify-between hover:bg-dark-800 active:scale-98 transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">⚓</span>
                        <div>
                            <div class="text-sm font-bold text-white">Одеса Радар</div>
                            <div class="text-[11px] text-slate-400">Запуск 1 грудня · 28 заявок на пошук</div>
                        </div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-brand-blue/20 text-brand-blue text-[10px] font-bold">Скоро</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. DISTRICT PICKER MODAL -->
    <div id="districtDrawer" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end md:items-center justify-center p-0 md:p-4">
        <div id="districtDrawerContent" class="w-full md:max-w-lg max-h-[85vh] bg-dark-900 border-t md:border border-white/10 rounded-t-3xl md:rounded-3xl p-5 space-y-4 text-white overflow-y-auto custom-scroll transform translate-y-full md:translate-y-0 transition-transform duration-300">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <div>
                    <h3 class="text-base font-bold text-white">📍 Оберіть район Києва</h3>
                    <p class="text-[11px] text-slate-400">Фільтрація прямих власників по локації</p>
                </div>
                <button onclick="closeDistrictDrawer()" class="text-xs font-bold text-slate-400 hover:text-white p-1">✕</button>
            </div>
            <!-- GPS Button -->

    <!-- ════════════════════════════════════════════════════════════════════
         APPLICATION JAVASCRIPT LOGIC
    ════════════════════════════════════════════════════════════════════ -->
    <script>
        // State
        let LISTINGS = [];
        let FAVORITES = new Set(JSON.parse(localStorage.getItem('kr_favs') || '[]'));
        let RENTED_REPORTS = new Set(JSON.parse(localStorage.getItem('kr_rented') || '[]'));
        let map = null;
        let mapMarkers = {};
        let userMarker = null;
        let userRadiusCircle = null;
        let userLocation = null;
        let currentActiveId = null;
        let mobileViewMode = 'map'; // 'map' or 'list'
        let photoIndexById = {};

        let currentFilter = {
            search: '',
            district: 'all',
            rooms: 0,
            maxPrice: 0,
            generator: false,
            gpon: false,
            favoritesOnly: false,
            nearbyOnly: false
        };

        // Telegram WebApp Setup
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function triggerHaptic(type = 'light') {
            try {
                if (tg?.HapticFeedback) {
                    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                    if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                    if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                }
            } catch (e) {}
        }

        // INITIALIZE LEAFLET MAP
        let markersCluster = null;

        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                minZoom: 4,
                maxZoom: 18
            }).setView([50.4501, 30.5234], 12);

            // Dark Gray Tiles
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                minZoom: 4, maxZoom: 18
            }).addTo(map);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
                minZoom: 4, maxZoom: 18
            }).addTo(map);

            // Initialize Leaflet MarkerCluster Group (Airbnb / Bird style)
            if (typeof L.markerClusterGroup === 'function') {
                markersCluster = L.markerClusterGroup({
                    maxClusterRadius: 45,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false,
                    zoomToBoundsOnClick: true,
                    disableClusteringAtZoom: 15,
                    iconCreateFunction: function(cluster) {
                        const count = cluster.getChildCount();
                        let cls = 'sm';
                        if (count >= 25) cls = 'lg';
                        else if (count >= 10) cls = 'md';
                        const size = cls === 'lg' ? 48 : (cls === 'md' ? 42 : 36);

                        return L.divIcon({
                            className: 'custom-cluster-wrap',
                            html: `<div class="cluster-pill ${cls}"><span>${count}</span></div>`,
                            iconSize: [size, size],
                            iconAnchor: [size / 2, size / 2]
                        });
                    }
                });
                map.addLayer(markersCluster);
            }
        }

        // HAVERSINE DISTANCE FORMULA
        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function formatDistance(distKm) {
            if (distKm === undefined || isNaN(distKm)) return '';
            if (distKm < 1) return `${Math.round(distKm * 1000)} м`;
            return `${distKm.toFixed(1)} км`;
        }

        function normalizeMetroName(raw) {
            if (!raw) return 'Київ';
            return raw.replace(/^(Метро|м\.|м|М)\s+/i, '').trim();
        }

        // FILTER ENGINE
        function getFilteredListings() {
            let res = LISTINGS.filter(item => {
                if (currentFilter.favoritesOnly && !FAVORITES.has(item.id)) return false;
                if (currentFilter.maxPrice > 0 && item.price > currentFilter.maxPrice) return false;
                if (currentFilter.rooms > 0) {
                    if (currentFilter.rooms === 3 && (item.rooms || 1) >= 3) {
                        // pass
                    } else if ((item.rooms || 1) !== currentFilter.rooms) {
                        return false;
                    }
                }
                if (currentFilter.generator && !item.generator) return false;
                if (currentFilter.gpon && !item.gpon) return false;
                if (currentFilter.district !== 'all') {
                    const d = currentFilter.district.toLowerCase();
                    const text = `${item.district || ''} ${item.address || ''} ${item.title || ''}`.toLowerCase();
                    if (!text.includes(d)) return false;
                }
                if (currentFilter.nearbyOnly && userLocation) {
                    if (item.distanceKm === undefined || item.distanceKm > 5.5) return false;
                }
                if (currentFilter.search) {
                    const q = currentFilter.search.toLowerCase();
                    const text = `${item.title || ''} ${item.address || ''} ${item.metro || ''} ${item.district || ''}`.toLowerCase();
                    if (!text.includes(q)) return false;
                }
                return true;
            });

            if (currentFilter.nearbyOnly && userLocation) {
                res.sort((a, b) => (a.distanceKm || 999) - (b.distanceKm || 999));
            }
            return res;
        }

        // RENDER UI
        function updateUI() {
            const filtered = getFilteredListings();
            
            // Update counts
            const countLabel = document.getElementById('resultsCountLabel');
            if (countLabel) countLabel.innerText = `Знайдено: ${filtered.length} прямих власників`;
            
            const mobLabel = document.getElementById('mobileViewLabel');
            if (mobLabel) mobLabel.innerText = mobileViewMode === 'list' ? 'Карта' : `Список (${filtered.length})`;

            renderMarkers(filtered);
            renderFeed(filtered);
        }

        // RENDER MAP MARKERS
        function renderMarkers(items) {
            if (markersCluster) {
                markersCluster.clearLayers();
            } else {
                Object.values(mapMarkers).forEach(m => map.removeLayer(m));
            }
            mapMarkers = {};

            const clusterItems = [];
            items.forEach((item) => {
                const shortLabel = Math.round(item.price / 1000) + 'k ₴';
                const hasPower = item.generator || item.gpon;
                const isActive = item.id === currentActiveId;

                const customIcon = L.divIcon({
                    className: 'bird-pin-wrap',
                    html: `
                        <div class="bird-pin ${isActive ? 'active' : ''}" id="pin-${item.id}">
                            ${hasPower ? '<span class="pin-dot"></span>' : ''}
                            <span>${shortLabel}</span>
                        </div>
                    `,
                    iconSize: [60, 26],
                    iconAnchor: [30, 13]
                });

                const marker = L.marker([item.lat, item.lng], { icon: customIcon });
                marker.on('click', (e) => {
                    if (e && e.originalEvent) {
                        e.originalEvent.stopPropagation();
                    }
                    focusDeal(item.id, true, true);
                });

                mapMarkers[item.id] = marker;
                if (markersCluster) {
                    clusterItems.push(marker);
                } else {
                    marker.addTo(map);
                }
            });

            if (markersCluster && clusterItems.length > 0) {
                markersCluster.addLayers(clusterItems);
            }
        }

        // RENDER VERTICAL FEED (Desktop Sidebar & Mobile List)
        function renderFeed(items) {
            const container = document.getElementById('cardsList');
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-400 space-y-2">
                        <div class="text-3xl">🔍</div>
                        <div class="text-sm font-bold text-white">Квартир не знайдено</div>
                        <div class="text-xs">Спробуйте змінити фільтри або скинути параметри пошуку</div>
                        <button onclick="resetAllFilters()" class="mt-3 px-4 py-2 rounded-xl bg-white text-dark-950 font-bold text-xs shadow-md">
                            Скинути всі фільтри
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map((item) => {
                const curPhoto = photoIndexById[item.id] || 0;
                const metroName = normalizeMetroName(item.metro);
                const isActive = item.id === currentActiveId;
                const images = item.images && item.images.length > 0 ? item.images : ['https://apollo.olxcdn.com/v1/files/sample/image;s=644x461'];

                return `
                <div id="card-${item.id}" onclick="focusDeal(${item.id}, true, false)" class="group rounded-2xl bg-dark-850 hover:bg-dark-800/90 border border-white/10 hover:border-white/20 transition-all p-3 cursor-pointer shadow-md ${isActive ? 'card-active-ring' : ''}">
                    <!-- Card Top: 16:9 Photo Carousel with Explicit Left/Right Mouse Buttons -->
                    <div class="relative w-full h-44 rounded-xl overflow-hidden bg-dark-950 mb-2.5">
                        <img id="feed-img-${item.id}" src="${images[curPhoto]}" class="w-full h-full object-cover transition-opacity duration-200" alt="${item.title}">
                        
                        <!-- Top Badges -->
                        <div class="absolute top-2 left-2 flex items-center gap-1 z-20">
                            ${item.source === 'domria' ? '<span class="px-2 py-0.5 rounded-lg bg-emerald-500/90 text-white font-extrabold text-[9px] uppercase tracking-wider shadow">DOM.RIA</span>' : '<span class="px-2 py-0.5 rounded-lg bg-sky-500/90 text-white font-extrabold text-[9px] uppercase tracking-wider shadow">OLX</span>'}
                            <span class="px-2 py-0.5 rounded-lg bg-black/75 backdrop-blur-sm text-emerald-400 font-extrabold text-[9px]">0% Комісії</span>
                        </div>

                        <!-- Favorite Heart Button -->
                        <button onclick="toggleFavorite(event, ${item.id})" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 hover:bg-black text-[13px] flex items-center justify-center z-20 transition-transform active:scale-90">
                            ${FAVORITES.has(item.id) ? '❤️' : '🤍'}
                        </button>

                        <!-- Left / Right Navigation Arrows for Mouse Users -->
                        ${images.length > 1 ? `
                            <button onclick="changePhoto(event, ${item.id}, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center font-bold text-xs z-20 transition-transform active:scale-90">‹</button>
                            <button onclick="changePhoto(event, ${item.id}, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center font-bold text-xs z-20 transition-transform active:scale-90">›</button>
                            <div class="absolute bottom-2 right-2 px-2 py-0.5 rounded-md bg-black/75 text-[10px] text-white font-mono z-20">
                                <span id="feed-count-${item.id}">${curPhoto + 1}/${images.length}</span>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Card Body -->
                    <div class="space-y-1.5">
                        <!-- Price & Savings -->
                        <div class="flex items-baseline justify-between">
                            <div class="text-lg font-black text-white">
                                ${item.price.toLocaleString('uk-UA')} ₴<span class="text-xs text-slate-400 font-normal">/міс</span>
                            </div>
                            <div class="text-xs font-bold text-emerald-400">
                                Економія +${(item.realtorCommissionSaved || item.price * 0.5).toLocaleString('uk-UA')} ₴
                            </div>
                        </div>

                        <!-- Title & Location -->
                        <h4 class="text-xs font-bold text-slate-200 truncate group-hover:text-white transition-colors">
                            ${item.title}
                        </h4>

                        <!-- Metro & specs -->
                        <div class="flex items-center justify-between text-xs text-slate-300">
                            <span class="truncate"><span class="text-white font-bold">Ⓜ️ ${metroName}</span> · ${item.walkMin || 7} хв</span>
                            <span class="text-slate-400 font-semibold shrink-0">${item.rooms || 1}к · ${item.area || 45} м² · ${item.floor || 3}/${item.totalFloors || 9} пов.</span>
                        </div>

                        <!-- Autonomous Badges & Distance -->
                        <div class="flex items-center justify-between pt-1 border-t border-white/5 text-[10px]">
                            <div class="flex items-center gap-1">
                                ${item.generator ? '<span class="px-1.5 py-0.5 rounded bg-white/10 text-white font-semibold">🔋 Генератор</span>' : ''}
                                ${item.gpon ? '<span class="px-1.5 py-0.5 rounded bg-white/10 text-white font-semibold">⚡ GPON</span>' : ''}
                                ${item.gas ? '<span class="px-1.5 py-0.5 rounded bg-white/10 text-slate-300">🔥 Газ</span>' : ''}
                            </div>
                            <button onclick="openDetail(${item.id})" class="px-3 py-1 rounded-lg bg-white hover:bg-slate-100 text-dark-950 font-black text-[11px] shadow-sm active:scale-95 transition-all">
                                Відкрити ›
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // FOCUS ON DEAL (Syncs Map & Left Sidebar seamlessly)
        function focusDeal(dealId, centerMap = true, scrollSidebar = true) {
            currentActiveId = dealId;
            const deal = LISTINGS.find(x => x.id === dealId);
            if (!deal) return;

            triggerHaptic('light');

            // 1. Highlight Pin on Map

        // PHOTO FLIPPER
        function changePhoto(e, id, delta) {
            if (e) e.stopPropagation();
            triggerHaptic('light');
            const apt = LISTINGS.find(x => x.id === id);
            if (!apt || !apt.images || apt.images.length <= 1) return;

            photoIndexById[id] = (photoIndexById[id] || 0) + delta;
            if (photoIndexById[id] < 0) photoIndexById[id] = apt.images.length - 1;
            if (photoIndexById[id] >= apt.images.length) photoIndexById[id] = 0;

            const cur = photoIndexById[id];
            const imgEl = document.getElementById(`feed-img-${id}`);
            const countEl = document.getElementById(`feed-count-${id}`);
            if (imgEl) imgEl.src = apt.images[cur];
            if (countEl) countEl.innerText = `${cur + 1}/${apt.images.length}`;

            // Also update modal or mobile preview if open
            const modalImg = document.getElementById(`modal-img-${id}`);
            if (modalImg) modalImg.src = apt.images[cur];
        }

        // LOAD DEALS FROM VPS / GITHUB REPO
        async function loadLiveDeals() {
            try {
                const res = await fetch('data/deals.json?v=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        LISTINGS = data;
                        const allBtn = document.getElementById('btnFilterAll');
                        if (allBtn) allBtn.innerText = `Всі (${LISTINGS.length})`;
                        const cityCount = document.getElementById('cityKyivCount');
                        if (cityCount) cityCount.innerText = `${LISTINGS.length} перевірених квартир`;
                    }
                }
            } catch (e) {
                console.log('Error loading deals:', e);
            }

            updateUI();

            // Deep link handling (?deal=X or #deal_X or #landlord)
            const hash = window.location.hash || '';
            const params = new URLSearchParams(window.location.search);
            const tgStartApp = tg?.initDataUnsafe?.start_param || '';

            if (hash === '#landlord' || tgStartApp === 'landlord') {
                setTimeout(openLandlordDrawer, 400);
            }

            let targetDealId = null;
            if (hash.startsWith('#deal_')) targetDealId = parseInt(hash.replace('#deal_', ''));
            else if (params.has('deal')) targetDealId = parseInt(params.get('deal'));
            else if (tgStartApp.startsWith('deal_')) targetDealId = parseInt(tgStartApp.replace('deal_', ''));

            if (targetDealId) {
                setTimeout(() => {
                    focusDeal(targetDealId, true, true);
                    openDetail(targetDealId);
                }, 500);
            }
        }

        // STARTUP
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initDesktopInteractions();
            // Default on mobile is map view with hidden sidebar
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('feedSidebar');
                if (sidebar) sidebar.classList.add('hidden');
            }
            loadLiveDeals();
        });
    </script>
</body>
</html>
