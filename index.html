<!DOCTYPE html>
<html lang="uk" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Київ Радар — Оренда без посередників</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#0b0c10',
                            900: '#14161f',
                            850: '#1c1f2b',
                            800: '#252938',
                            700: '#32374a'
                        },
                        brand: {
                            blue: '#007aff',
                            green: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0b0c10;
        }

        /* Solid Dark Surface Panels (Apple / Monobank Dark) */
        .surface-panel {
            background: rgba(20, 22, 31, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Bird Kyiv Native Map Marker Pins */
        .bird-pin-wrap {
            background: none !important;
            border: none !important;
        }
        .bird-pin {
            position: relative;
            background: #1c1f2b;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.4, 1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            gap: 4px;
            transform: translate(-50%, -50%);
        }
        .bird-pin.active {
            background: #ffffff;
            color: #0b0c10;
            border-color: #ffffff;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
            z-index: 9999 !important;
            font-weight: 800;
        }
        .bird-pin .pin-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #007aff;
        }
        .bird-pin.active .pin-dot {
            background: #007aff;
        }
        .bird-pin .pin-badge {
            font-size: 8px;
            padding: 1px 3px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.12);
            color: #d1d5db;
        }
        .bird-pin.active .pin-badge {
            background: #0b0c10;
            color: #ffffff;
        }

        /* Pulsing Blue User Location Marker (Apple / Uber Style) */
        .user-loc-wrap {
            background: transparent !important;
            border: none !important;
        }
        .user-loc-container {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
        }
        .user-loc-dot {
            width: 14px;
            height: 14px;
            background: #007aff;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(0, 122, 255, 0.95), 0 2px 6px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }
        .user-loc-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 46px;
            height: 46px;
            margin-left: -23px;
            margin-top: -23px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.35);
            animation: locPulse 2.2s infinite cubic-bezier(0.2, 0.6, 0.35, 1);
            z-index: 1;
            pointer-events: none;
        }
        @keyframes locPulse {
            0% { transform: scale(0.35); opacity: 0.9; }
            70% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Modern Compact Bird Kyiv 2.0 Carousel (77% Map Visibility) */
        .cards-carousel {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            padding: 0 16px 8px 16px;
        }
        .cards-carousel::-webkit-scrollbar {
            display: none;
        }
        .apartment-card {
            flex: 0 0 calc(100vw - 32px);
            max-width: 375px;
            scroll-snap-align: center;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .apartment-card.active-card {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.9);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="relative h-full w-full">

    <!-- FULLSCREEN MAP (77% Visible Area) -->
    <div id="map"></div>

    <!-- TOP FLOATING CONTROL BAR -->
    <header class="absolute top-3 left-3 right-3 z-30 flex flex-col gap-2 pointer-events-none">
        <!-- Search & Filter Row -->
        <div class="surface-panel rounded-2xl p-2 px-3 flex items-center justify-between gap-2 shadow-2xl pointer-events-auto">
            <!-- Brand Mark -->
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 rounded-xl bg-white text-dark-950 flex items-center justify-center font-black text-xs shrink-0 shadow-sm">
                    КР
                </div>
                <div class="min-w-0 pr-1">
                    <div class="flex items-center gap-1">
                        <span class="text-xs font-bold text-white tracking-tight">Київ Радар</span>
                        <span class="px-1 py-0.2 rounded text-[9px] font-bold bg-white/10 text-emerald-400">0%</span>
                    </div>
                    <span class="text-[10px] text-slate-400 block truncate">Прямі власники</span>
                </div>
            </div>

            <!-- Search Field -->
            <div class="flex-1 relative flex items-center min-w-0">
                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                </svg>
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Метро, район, вулиця…" class="w-full bg-dark-900 border border-white/10 rounded-xl pl-8 pr-2.5 py-1.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-white/30 transition-all">
            </div>

            <!-- District Picker Trigger -->
            <button onclick="openDistrictDrawer()" class="shrink-0 px-2.5 py-1.5 rounded-xl bg-dark-850 hover:bg-dark-800 text-slate-200 border border-white/10 transition-all active:scale-95 flex items-center gap-1 text-xs font-semibold shadow-sm">
                <svg class="w-3.5 h-3.5 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <span class="text-[11px] whitespace-nowrap">Район</span>
            </button>
        </div>

        <!-- Clean Horizontal Scrollable Filter Bar (Monochrome Apple / Monobank Style) -->
        <div class="pointer-events-auto w-full">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5">
                <button onclick="toggleQuickFilter(this, 'all')" id="btnFilterAll" class="q-filter active shrink-0 py-1.5 px-3 rounded-xl text-[11px] font-bold bg-white text-dark-950 text-center shadow-md whitespace-nowrap transition-all">
                    Всі (180)
                </button>
                <button onclick="toggleQuickFilter(this, 'favs')" id="btnFilterFavs" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    🤍 Збережені
                </button>
                <button onclick="toggleQuickFilter(this, 'rooms_1')" id="btnFilterR1" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    1-кімн
                </button>
                <button onclick="toggleQuickFilter(this, 'rooms_2')" id="btnFilterR2" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    2-кімн
                </button>
                <button onclick="toggleQuickFilter(this, 'max_15k')" id="btnFilter15k" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    До 15k ₴
                </button>
                <button onclick="toggleQuickFilter(this, 'max_20k')" id="btnFilter20k" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    До 20k ₴
                </button>
                <button onclick="activateNearbyMode(this)" id="btnFilterNearby" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    📍 Поруч
                </button>
                <button onclick="toggleQuickFilter(this, 'generator')" id="btnFilterGen" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    Генератор
                </button>
                <button onclick="toggleQuickFilter(this, 'gpon')" id="btnFilterGpon" class="q-filter shrink-0 py-1.5 px-2.5 rounded-xl text-[11px] font-semibold surface-panel text-slate-300 hover:text-white text-center whitespace-nowrap transition-all">
                    GPON
                </button>
            </div>
        </div>

        <!-- Proximity Active Banner -->
        <div id="nearbyBanner" class="hidden pointer-events-auto surface-panel rounded-xl px-3 py-1.5 flex items-center justify-between shadow-xl text-xs">
            <div class="flex items-center gap-1.5 truncate">
                <span class="w-2 h-2 rounded-full bg-brand-blue animate-pulse shrink-0"></span>
                <span id="nearbyBannerText" class="font-medium text-slate-200 truncate">Поруч з вами</span>
            </div>
            <button onclick="resetNearbyMode()" class="text-slate-400 hover:text-white font-bold text-[11px] pl-2 shrink-0">
                Скинути ✕
            </button>
        </div>
    </header>

    <!-- RIGHT FLOATING MAP CONTROLS -->
    <div class="absolute right-3 top-36 z-20 flex flex-col gap-2">
        <button id="btnLocate" onclick="handleLocateClick()" class="surface-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all group" title="Поруч зі мною (GPS)">
            <svg class="w-4 h-4 text-brand-blue group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
            </svg>
        </button>
        <button onclick="recenterKyiv()" class="surface-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all group" title="Київ центр">
            <svg class="w-4 h-4 text-slate-300 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
        </button>
        <button onclick="zoomMap(1)" class="surface-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all text-sm font-bold leading-none">
            +
        </button>
        <button onclick="zoomMap(-1)" class="surface-panel p-2.5 rounded-2xl shadow-xl text-slate-200 hover:text-white active:scale-95 transition-all text-sm font-bold leading-none">
            −
        </button>
    </div>

    <!-- BOTTOM FLOATING BIRD DECK (Compact Horizontal Cards - 77% Map Visibility) -->
    <div class="absolute bottom-3 left-0 right-0 z-30">
        <div class="cards-carousel" id="cardsCarousel">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- FULL DETAIL MODAL / SHEET -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end">
        <div class="w-full max-h-[90vh] bg-dark-900 border-t border-white/10 rounded-t-3xl overflow-y-auto p-5 space-y-4 text-white transform translate-y-full transition-transform duration-300" id="detailSheetContent">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- DISTRICT / NEIGHBORHOOD DRAWER -->
    <div id="districtDrawer" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-200 flex items-end">
        <div class="w-full max-h-[85vh] bg-dark-900 border-t border-white/10 rounded-t-3xl overflow-y-auto p-5 space-y-4 text-white transform translate-y-full transition-transform duration-300" id="districtDrawerContent">
            <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-2"></div>
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <div>
                    <h3 class="text-base font-bold text-white">Оберіть район Києва</h3>
                    <p class="text-[11px] text-slate-400">Покаже всі квартири у вашому районі та поруч</p>
                </div>
                <button onclick="closeDistrictDrawer()" class="text-xs font-bold text-slate-400 hover:text-white">✕</button>
            </div>

            <!-- 10 Official Kyiv Districts Grid -->
            <div class="grid grid-cols-2 gap-2 text-xs" id="districtGrid">
                <button onclick="selectKyivDistrict('Оболонь', 50.5050, 30.5080)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Оболонський</div>
                    <div class="text-[10px] text-slate-400">Оболонь, Мінська, Героїв Дніпра</div>
                </button>
                <button onclick="selectKyivDistrict('Поділ', 50.4680, 30.5120)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Подільський</div>
                    <div class="text-[10px] text-slate-400">Поділ, Контрактова, Виноградар</div>
                </button>
                <button onclick="selectKyivDistrict('Печерськ', 50.4250, 30.5350)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Печерський</div>
                    <div class="text-[10px] text-slate-400">Печерськ, Либідська, Дружби Народів</div>
                </button>
                <button onclick="selectKyivDistrict('Шевченків', 50.4580, 30.4850)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Шевченківський</div>
                    <div class="text-[10px] text-slate-400">Лук'янівка, Центр, КПІ, Сирець</div>
                </button>
                <button onclick="selectKyivDistrict('Голосієво', 50.3950, 30.4980)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Голосіївський</div>
                    <div class="text-[10px] text-slate-400">Голосіївська, Васильківська, ВДНГ</div>
                </button>
                <button onclick="selectKyivDistrict('Дарниця', 50.3980, 30.6350)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Дарницький / Позняки</div>
                    <div class="text-[10px] text-slate-400">Позняки, Осокорки, Харківська</div>
                </button>
                <button onclick="selectKyivDistrict('Солом\'янка', 50.4350, 30.4550)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Солом'янський</div>
                    <div class="text-[10px] text-slate-400">Вокзальна, Шулявка, Солом'янка</div>
                </button>
                <button onclick="selectKyivDistrict('Дніпров', 50.4520, 30.5980)" class="dist-choice p-3 rounded-xl bg-dark-850 border border-white/5 text-left font-semibold hover:bg-dark-800 transition-all">
                    <div class="font-bold text-white">Дніпровський</div>
                    <div class="text-[10px] text-slate-400">Лівобережна, Русанівка, Дарниця</div>
                </button>
            </div>

            <!-- Test Center Button -->
            <button onclick="selectKyivDistrict('Центр', 50.4501, 30.5234)" class="w-full py-3 rounded-xl bg-white text-dark-950 font-bold text-xs flex items-center justify-center gap-2 active:scale-98 transition-all">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
                <span>Моя точка: Центр (Майдан / Хрещатик)</span>
            </button>
        </div>
    </div>

    <script>
        // Telegram WebApp Setup
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0b0c10');
            tg.setBackgroundColor('#0b0c10');
        }

        function triggerHaptic(type = 'light') {
            if (tg?.HapticFeedback) {
                if (type === 'selection') tg.HapticFeedback.selectionChanged();
                else tg.HapticFeedback.impactOccurred(type);
            }
        }

        // Favorites & Rented Engine (Bird / Monobank style)
        let FAVORITES = new Set(JSON.parse(localStorage.getItem('kyiv_radar_favs') || '[]'));
        let RENTED_REPORTS = new Set(JSON.parse(localStorage.getItem('kyiv_radar_rented') || '[]'));

        function toggleFavorite(e, id) {
            if (e) e.stopPropagation();
            triggerHaptic('medium');
            if (FAVORITES.has(id)) {
                FAVORITES.delete(id);
            } else {
                FAVORITES.add(id);
            }
            localStorage.setItem('kyiv_radar_favs', JSON.stringify(Array.from(FAVORITES)));
            updateFavoritesUI();
        }

        function updateFavoritesUI() {
            const favCount = FAVORITES.size;
            const favBtn = document.getElementById('btnFilterFavs');
            if (favBtn) {
                favBtn.innerHTML = favCount > 0 ? `❤️ Збережені (${favCount})` : `🤍 Збережені`;
            }
            document.querySelectorAll('.fav-heart-btn').forEach(btn => {
                const id = parseInt(btn.getAttribute('data-id'));
                if (FAVORITES.has(id)) {
                    btn.innerHTML = '❤️';
                    btn.classList.add('scale-110');
                } else {
                    btn.innerHTML = '🤍';
                    btn.classList.remove('scale-110');
                }
            });
            const modalFavText = document.getElementById('modalFavText');
            if (modalFavText && activeDetailItem) {
                modalFavText.innerText = FAVORITES.has(activeDetailItem.id) ? '❤️ Збережено' : '🤍 Зберегти';
            }
            if (currentFilter.favoritesOnly) {
                updateUI();
            }
        }

        function reportRented(id) {
            triggerHaptic('heavy');
            RENTED_REPORTS.add(id);
            localStorage.setItem('kyiv_radar_rented', JSON.stringify(Array.from(RENTED_REPORTS)));
            closeDetail();
            if (tg?.showAlert) {
                tg.showAlert('Дякуємо! Ми позначили цей лот для швидкої модерації.');
            } else {
                alert('Дякуємо! Ми позначили цей лот для швидкої модерації.');
            }
            updateUI();
        }

        // Active State
        let LISTINGS = [];
        let currentFilter = {
            search: '',
            district: 'all',
            rooms: 0,
            maxPrice: 0,
            favoritesOnly: false,
            generator: false,
            gpon: false,
            nearbyOnly: false
        };

        let currentActiveIndex = 0;
        let mapMarkers = {};
        let userLocation = null;
        let userMarker = null;
        let userRadiusCircle = null;

        // INITIALIZE MAP
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            minZoom: 4,
            maxZoom: 18,
            touchZoom: true
        }).setView([50.4501, 30.5234], 12);

        // Apple Maps Dark Theme Tiles
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            minZoom: 4, maxZoom: 18
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
            minZoom: 4, maxZoom: 18
        }).addTo(map);

        // HAVERSINE DISTANCE FORMULA
        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function formatDistance(distKm) {
            if (distKm === undefined || distKm === null || isNaN(distKm)) return '';
            if (distKm < 1) {
                return `${Math.round(distKm * 1000)} м`;
            }
            return `${distKm.toFixed(1)} км`;
        }

        // GEOLOCATION ENGINE
        function handleLocateClick() {
            triggerHaptic('medium');
            const locateBtn = document.getElementById('btnLocate');
            if (locateBtn) locateBtn.classList.add('animate-pulse');

            // 1. Telegram WebApp Location Manager
            if (window.Telegram?.WebApp?.LocationManager) {
                try {
                    window.Telegram.WebApp.LocationManager.init(() => {
                        window.Telegram.WebApp.LocationManager.getLocation((data) => {
                            if (locateBtn) locateBtn.classList.remove('animate-pulse');
                            if (data && data.latitude && data.longitude) {
                                onGotExactLocation(data.latitude, data.longitude, data.accuracy || 20);
                                return;
                            }
                            fallbackBrowserGeolocation(locateBtn);
                        });
                    });
                    return;
                } catch (e) {
                    console.log('TG LocationManager fallback:', e);
                }
            }

            fallbackBrowserGeolocation(locateBtn);
        }

        function fallbackBrowserGeolocation(locateBtn) {
            if (!navigator.geolocation) {
                if (locateBtn) locateBtn.classList.remove('animate-pulse');
                openDistrictDrawer();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    if (locateBtn) locateBtn.classList.remove('animate-pulse');
                    onGotExactLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                },
                (err) => {
                    if (locateBtn) locateBtn.classList.remove('animate-pulse');
                    console.warn('Geolocation error:', err);
                    openDistrictDrawer();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        }

        function onGotExactLocation(lat, lng, accuracy = 20) {
            userLocation = { lat, lng, accuracy };

            // Calculate distance to all items
            LISTINGS.forEach(item => {
                if (item.lat && item.lng) {
                    item.distanceKm = getHaversineDistance(lat, lng, item.lat, item.lng);
                }
            });

            // 1. Add / update blue pulsing marker at EXACT USER GPS COORDINATES!
            const userIcon = L.divIcon({
                className: 'user-loc-wrap',
                html: `
                    <div class="user-loc-container">
                        <div class="user-loc-pulse"></div>
                        <div class="user-loc-dot"></div>
                    </div>
                `,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], {
                    icon: userIcon,
                    zIndexOffset: 10000
                }).addTo(map);
            }

            // Distance to Kyiv center
            const distToKyiv = getHaversineDistance(lat, lng, 50.4501, 30.5234);

            if (distToKyiv <= 45) {
                // Inside Greater Kyiv!
                if (userRadiusCircle) map.removeLayer(userRadiusCircle);
                userRadiusCircle = L.circle([lat, lng], {
                    radius: 3500,
                    color: '#007aff',
                    fillColor: '#007aff',
                    fillOpacity: 0.08,
                    weight: 1.5,
                    dashArray: '4, 6'
                }).addTo(map);

                currentFilter.nearbyOnly = true;

                const banner = document.getElementById('nearbyBanner');
                const bannerText = document.getElementById('nearbyBannerText');
                if (banner && bannerText) {
                    const count = getFilteredListings().length;
                    bannerText.innerHTML = `Поруч з вами (радіус 3.5 км: ${count} вар.)`;
                    banner.classList.remove('hidden');
                }

                map.flyTo([lat, lng], 14, { duration: 0.8 });
            } else {
                // Outside Kyiv (e.g. testing in Pavlograd or VPN) - SHOW EXACT PIN!
                map.flyTo([lat, lng], 12, { duration: 0.9 });

                const banner = document.getElementById('nearbyBanner');
                const bannerText = document.getElementById('nearbyBannerText');
                if (banner && bannerText) {
                    bannerText.innerHTML = `📍 Ваша точка: <b>${formatDistance(distToKyiv)}</b> від Києва <button onclick="recenterKyiv()" class="ml-2 underline font-bold text-white">До Києва ›</button>`;
                    banner.classList.remove('hidden');
                }
            }

            updateUI();
        }

        // FILTER ENGINE
        function getFilteredListings() {
            let res = LISTINGS.filter(item => {
                if (currentFilter.favoritesOnly && !FAVORITES.has(item.id)) return false;
                if (currentFilter.maxPrice > 0 && item.price > currentFilter.maxPrice) return false;
                if (currentFilter.rooms > 0) {
                    if (currentFilter.rooms === 3 && (item.rooms || 1) >= 3) {
                        // pass
                    } else if ((item.rooms || 1) !== currentFilter.rooms) {
                        return false;
                    }
                }
                if (currentFilter.generator && !item.generator) return false;
                if (currentFilter.gpon && !item.gpon) return false;
                if (currentFilter.district !== 'all') {
                    if (!item.district || !item.district.toLowerCase().includes(currentFilter.district.toLowerCase())) {
                        return false;
                    }
                }
                if (currentFilter.nearbyOnly && userLocation) {
                    if (item.distanceKm === undefined || item.distanceKm > 5.5) return false;
                }
                if (currentFilter.search) {
                    const q = currentFilter.search.toLowerCase();
                    const text = `${item.title} ${item.address} ${item.metro} ${item.district}`.toLowerCase();
                    if (!text.includes(q)) return false;
                }
                return true;
            });

            if (currentFilter.nearbyOnly && userLocation) {
                res.sort((a, b) => (a.distanceKm || 999) - (b.distanceKm || 999));
            }

            return res;
        }

        // BIRD KYIV CORE MECHANIC: Swipe card -> Map flies to coordinate with Camera Offset
        function selectCard(index, scrollCarousel = true) {
            const items = getFilteredListings();
            if (index < 0 || index >= items.length) return;

            currentActiveIndex = index;
            const activeItem = items[index];

            document.querySelectorAll('.bird-pin').forEach(p => p.classList.remove('active'));
            const activePin = document.getElementById(`pin-${activeItem.id}`);
            if (activePin) activePin.classList.add('active');

            // Camera offset keeps pin in upper 40% of screen above the compact card
            const cameraLat = activeItem.lat - 0.006;
            map.flyTo([cameraLat, activeItem.lng], 14.5, {
                duration: 0.6,
                easeLinearity: 0.25
            });

            document.querySelectorAll('.apartment-card').forEach(c => c.classList.remove('active-card'));
            const activeCard = document.getElementById(`card-${activeItem.id}`);
            if (activeCard) {
                activeCard.classList.add('active-card');
                if (scrollCarousel) {
                    activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }

            triggerHaptic('selection');
        }

        let scrollTimeout;
        function attachCarouselScrollListener(items) {
            const carousel = document.getElementById('cardsCarousel');
            carousel.onscroll = () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const cards = Array.from(carousel.children);
                    const carouselCenter = carousel.scrollLeft + (carousel.offsetWidth / 2);
                    
                    let closestIndex = 0;
                    let minDiff = Infinity;

                    cards.forEach((c, idx) => {
                        const cardCenter = c.offsetLeft + (c.offsetWidth / 2);
                        const diff = Math.abs(carouselCenter - cardCenter);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIndex = idx;
                        }
                    });

                    if (closestIndex !== currentActiveIndex && closestIndex < items.length) {
                        selectCard(closestIndex, false);
                    }
                }, 80);
            };
        }

                    <!-- Tap Zones (left 50% = prev, right 50% = next) -->
                    <div class="absolute inset-y-0 left-0 w-1/2 z-10 cursor-pointer" onclick="changeModalPhoto(-1)"></div>
                    <div class="absolute inset-y-0 right-0 w-1/2 z-10 cursor-pointer" onclick="changeModalPhoto(1)"></div>

                    <!-- Direct Owner Tag + Source & Freshness -->
                    <div class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-black/80 backdrop-blur-md text-[10px] font-bold text-white flex items-center gap-1.5 z-20 pointer-events-none border border-white/10">
                        <span class="w-1.5 h-1.5 rounded-full ${item.source === 'domria' ? 'bg-emerald-400' : 'bg-sky-400'}"></span>
                        <span>${item.sourceLabel || 'Прямий власник'}</span>
                        <span class="text-slate-500">·</span>
                        <span class="text-emerald-400">0% комісії</span>
                        <span class="text-slate-500">·</span>
                        <span class="text-slate-300 font-mono text-[9px]">${item.freshness || 'Сьогодні'}</span>
                    </div>

                    <!-- Nav Arrows (if > 1 photo) -->
                    ${images.length > 1 ? `
                        <button onclick="changeModalPhoto(-1)" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center text-sm font-bold z-20 active:scale-95 transition-all">‹</button>
                        <button onclick="changeModalPhoto(1)" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center text-sm font-bold z-20 active:scale-95 transition-all">›</button>
                    ` : ''}

                    <!-- Bottom Indicator: Bars + Counter -->
                    <div class="absolute bottom-2.5 inset-x-3 flex items-center justify-between z-20 pointer-events-none">
                        <div id="modalPhotoBars" class="flex items-center gap-1">
                            ${images.map((_, i) => `<span class="h-1 rounded-full transition-all ${i === 0 ? 'w-5 bg-white' : 'w-1.5 bg-white/40'}"></span>`).join('')}
                        </div>
                        <span id="modalPhotoCounter" class="px-2 py-0.5 rounded-md bg-black/75 text-[10px] font-mono text-white font-bold">1 з ${images.length}</span>
                    </div>
                </div>

                <!-- Price & Commission Savings -->
                <div class="flex items-center justify-between pt-1">
                    <div>
                        <div class="text-xl font-black text-white">${item.price.toLocaleString('uk-UA')} ₴ / міс</div>
                        <div class="text-xs text-emerald-400 font-semibold">Економія +${item.realtorCommissionSaved.toLocaleString('uk-UA')} ₴ без рієлтора</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleFavorite(event, ${item.id})" class="px-2.5 py-1.5 rounded-xl bg-dark-850 hover:bg-dark-900 border border-white/10 text-xs font-semibold flex items-center gap-1 active:scale-95 transition-all">
                            <span id="modalFavText">${FAVORITES.has(item.id) ? '❤️ Збережено' : '🤍 Зберегти'}</span>
                        </button>
                        <button onclick="closeDetail()" class="p-2 rounded-xl bg-dark-850 text-slate-400 hover:text-white font-bold text-xs">✕</button>
                    </div>
                </div>

                <!-- Location, Metro & Detailed Specs -->
                <div class="p-3.5 rounded-xl bg-dark-850 border border-white/5 space-y-2">
                    <div class="text-xs text-white font-bold flex items-center justify-between">
                        <span>Ⓜ️ ${metroName} · ${item.walkMin} хв пішки · ${item.district}</span>
                        ${item.distanceKm !== undefined ? `
                            <span class="px-2 py-0.5 rounded-md bg-brand-blue/15 text-brand-blue text-[10px] font-bold border border-brand-blue/30">
                                📍 ${formatDistance(item.distanceKm)} від вас
                            </span>
                        ` : ''}
                    </div>
                    <div class="text-[11px] text-slate-300 flex items-center gap-2 flex-wrap pt-0.5">
                        <span>📍 ${item.address}</span>
                        <span class="text-slate-600">·</span>
                        <span>🚪 <b>${item.rooms || 1}-кімн.</b></span>
                        <span class="text-slate-600">·</span>
                        <span>📐 <b>${item.area} м²</b></span>
                        <span class="text-slate-600">·</span>
                        <span>🏢 <b>Поверх:</b> ${item.floor} з ${item.totalFloors}</span>
                    </div>
                </div>

                <!-- Blackout / Winter Readiness -->
                <div class="p-3.5 rounded-xl bg-dark-850 border border-white/5 space-y-2">
                    <div class="text-xs font-bold text-slate-300">Автономність житла:</div>
                    <div class="flex flex-wrap gap-2 text-xs">
                        <span class="px-2.5 py-1 rounded-lg ${item.gpon ? 'bg-white/10 text-white font-medium border border-white/5' : 'bg-dark-900 text-slate-500'}">
                            ${item.gpon ? 'GPON інтернет працює без світла' : 'Без GPON'}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg ${item.generator ? 'bg-white/10 text-white font-medium border border-white/5' : 'bg-dark-900 text-slate-500'}">
                            ${item.generator ? 'Генератор у ЖК на ліфти та воду' : 'Без генератора'}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg ${item.gas ? 'bg-white/10 text-white font-medium border border-white/5' : 'bg-dark-900 text-slate-500'}">
                            ${item.gas ? 'Газ (гаряча вода/плита)' : 'Електроплита'}
                        </span>
                    </div>
                </div>

                <!-- Direct Owner Phone Unlock (Single High-Converting Monobank Funnel) -->
                <div class="p-4 rounded-2xl bg-dark-850 border border-white/10 space-y-3 shadow-lg">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Прямий номер господаря:</div>
                            <div class="text-base font-black text-white font-mono tracking-wider">${item.phoneMasked || '+380 67 ••• •• 42'}</div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-emerald-400">Економія ${item.realtorCommissionSaved.toLocaleString('uk-UA')} ₴</span>
                            <div class="text-[10px] text-slate-400">Замість 50% рієлтору</div>
                        </div>
                    </div>
                    <a href="https://t.me/prostov_shrink_bot?start=unlock_${item.id}" target="_blank" onclick="triggerHaptic('heavy')" class="w-full py-3.5 rounded-xl bg-white hover:bg-slate-100 text-dark-950 font-black text-xs flex items-center justify-center gap-2 shadow-xl active:scale-98 transition-all">
                        <svg class="w-4 h-4 fill-current text-dark-950" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        <span>Отримати прямий номер за 99 ₴</span>
                    </a>
                    <div class="text-[10px] text-slate-400 text-center flex items-center justify-center gap-1.5 pt-0.5">
                        <span class="text-emerald-400">🛡️</span> <b>100% Гарантія:</b> якщо вже здано — безкоштовна заміна контакту
                    </div>
                </div>

                <!-- 1-Tap Viral Share + Free 2026 Contract -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="shareListing(${item.id})" class="py-2.5 px-3 rounded-xl surface-panel border border-white/10 hover:border-white/20 text-white font-bold text-[11px] flex items-center justify-center gap-1.5 active:scale-95 transition-all">
                        <span>✈️ Надіслати другу</span>
                    </button>
                    <a href="https://t.me/prostov_shrink_bot?start=contract" target="_blank" class="py-2.5 px-3 rounded-xl surface-panel border border-white/10 hover:border-white/20 text-sky-400 font-bold text-[11px] flex items-center justify-center gap-1.5 active:scale-95 transition-all text-center">
                        <span>📄 Договір 2026</span>
                    </a>
                </div>

                <!-- Report Already Rented -->
                <button onclick="reportRented(${item.id})" class="w-full py-2 rounded-xl bg-dark-850 hover:bg-dark-900 border border-white/5 text-slate-400 hover:text-rose-400 text-[11px] font-medium transition-colors">
                    ✕ Повідомити: цю квартиру вже здали
                </button>

                <div class="text-center pt-1">
                    <a href="https://t.me/pavlograd_admin" target="_blank" class="text-[11px] text-slate-500 hover:text-slate-400 transition-colors">
                        Маєте питання або пропозицію? Служба підтримки Радара
                    </a>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeDetail() {
            triggerHaptic('light');
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailSheetContent');
            content.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // DISTRICT DRAWER
        function openDistrictDrawer() {
            triggerHaptic('medium');
            const drawer = document.getElementById('districtDrawer');
            const content = document.getElementById('districtDrawerContent');
            drawer.classList.remove('hidden');
            setTimeout(() => {
                drawer.classList.remove('opacity-0');
                content.classList.remove('translate-y-full');
            }, 10);
        }

        function closeDistrictDrawer() {
            triggerHaptic('light');
            const drawer = document.getElementById('districtDrawer');
            const content = document.getElementById('districtDrawerContent');
            content.classList.add('translate-y-full');
            drawer.classList.add('opacity-0');
            setTimeout(() => drawer.classList.add('hidden'), 200);
        }

        // INITIAL LOAD: Live deals from VPS
        async function loadLiveDeals() {
            try {
                const res = await fetch('data/deals.json?v=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        LISTINGS = data;
                        const allBtn = document.getElementById('btnFilterAll');
                        if (allBtn) allBtn.innerText = `Всі (${LISTINGS.length})`;
                        console.log('Loaded live deals:', data.length);
                    }
                }
            } catch (e) {
                console.log('Error loading deals:', e);
            }
            updateUI();

            // Handle Deep Link (?deal=X or #deal_X or startapp=deal_X)
            const hash = window.location.hash || '';
            const params = new URLSearchParams(window.location.search);
            const tgStartApp = window.Telegram?.WebApp?.initDataUnsafe?.start_param || '';
            
            let targetDealId = null;
            if (hash.startsWith('#deal_')) {
                targetDealId = parseInt(hash.replace('#deal_', ''));
            } else if (params.has('deal')) {
                targetDealId = parseInt(params.get('deal'));
            } else if (tgStartApp.startsWith('deal_')) {
                targetDealId = parseInt(tgStartApp.replace('deal_', ''));
            }

            if (targetDealId) {
                const targetIdx = LISTINGS.findIndex(x => x.id === targetDealId);
                if (targetIdx !== -1) {
                    setTimeout(() => {
                        selectCard(targetIdx, true);
                        openDetail(targetDealId);
                    }, 400);
                }
            }
        }

        loadLiveDeals();
    </script>
</body>
</html>
