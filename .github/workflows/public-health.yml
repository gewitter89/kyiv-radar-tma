name: Read-only public production health
on:
  # GitHub's generated Pages workflow is emitted as a dynamic event and did
  # not produce a workflow_run follow-up in our first observed release.
  # A scoped main push ensures the *live* site/API is checked at least once
  # for actual website/monitor code changes. It is not an atomic deploy gate:
  # daily checks and optional workflow_run remain independent safeguards.
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "data/deals.json"
      - "scripts/monitor_public_health.py"
      - ".github/workflows/public-health.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 06 * * *'
  # Verify ACTUALLY SERVED Pages/API after each successful site publication,
  # rather than interpreting a green Pages build as proof of runtime safety.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  public-health:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify served public HTML, JSON and API privacy (read-only)
        run: python scripts/monitor_public_health.py
