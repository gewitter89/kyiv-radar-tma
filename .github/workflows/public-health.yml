name: Read-only public production health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 06 * * *'

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public health and catalog privacy (read-only)
        run: python scripts/monitor_public_health.py
