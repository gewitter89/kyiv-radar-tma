name: Read-only public production health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 06 * * *'
  # Verify ACTUALLY SERVED Pages/API after each successful site publication,
  # rather than interpreting a green Pages build as proof of runtime safety.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  public-health:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify served public HTML, JSON and API privacy (read-only)
        run: python scripts/monitor_public_health.py
