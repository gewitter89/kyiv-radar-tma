name: Quality and security
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      BOT_TOKEN: "123456789:TEST_BOT_TOKEN_FOR_HMAC_VALIDATION"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pytest pytest-asyncio httpx playwright
          python -m playwright install --with-deps chromium
      - name: Compile backend modules
        run: python -m compileall -q server
      - name: Audit public listings without promoting unverified claims
        run: |
          python scripts/audit_catalog.py --output artifacts/catalog-quality.json
          python scripts/catalog_integrity.py --output artifacts/catalog-integrity.json
      - name: Capture phone, tablet and desktop preview
        run: python scripts/capture_ui.py
      - name: Store UI screenshots for human review
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-radar-visual-preview
          path: |
            artifacts/*.png
            artifacts/catalog-quality.json
            artifacts/catalog-integrity.json
          retention-days: 7
      - name: Test isolated user journeys, media privacy, moderation and responsive UI
        run: |
          python -m pytest -q \
            tests/test_isolated_staging.py \
            tests/test_moderation_callback_isolated.py \
            tests/test_moderation_atomic_resilience.py \
            tests/test_user_journeys_isolated.py \
            tests/test_privacy_and_media.py \
            tests/test_upload_body_limit.py \
            tests/test_smart_radar.py \
            tests/test_first_visit_v17.py \
            tests/test_kyiv_signal_theme_v112.py \
            tests/test_smart_filters_v113.py \
            tests/test_simple_first_view.py \
            tests/test_catalog_integrity_v116.py \
            tests/test_reviewer_queue_v117.py \
            tests/test_rental_safety_v116.py \
            tests/test_listing_light_contrast_v116.py \
            tests/test_catalog_claims.py \
            tests/test_listing_trust_v18.py \
            tests/test_trust_experience_v18.py \
            tests/test_vps_release_snapshot.py \
            tests/test_public_catalog_privacy.py \
            tests/test_photo_swipe.py \
            tests/test_listing_contact_v115.py \
            tests/test_send_contact_ui.py
