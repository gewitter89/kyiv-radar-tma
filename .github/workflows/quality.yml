name: Quality and security
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      BOT_TOKEN: "123456789:TEST_BOT_TOKEN_FOR_HMAC_VALIDATION"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Block historical records in publishable source
        run: python scripts/check_public_distribution.py
      - name: Regression test the public release blocker
        run: python -m unittest discover -s tests -p test_release_gate_v132.py
      - name: Test post-release smoke contract without network
        run: python -m unittest discover -s tests -p test_release_smoke_v132.py
      - name: Generate disposable synthetic browser test catalog
        run: python scripts/prepare_ci_fixtures.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pytest pytest-asyncio httpx playwright
          python -m playwright install --with-deps chromium
      - name: Verify public health offline semantics
        run: python -m pytest -q tests/test_public_health_v131.py
      - name: Verify server-side source rights and privacy before browser suite
        run: python -m pytest -q tests/test_backend_public_source_gate_v132.py tests/test_catalog_claims.py tests/test_listing_trust_v18.py
      - name: Validate room-count consistency without browser network
        run: python -m pytest -q tests/test_room_consistency_v134.py
      - name: Compile backend modules
        run: python -m compileall -q server scripts
      - name: Audit public listings without promoting unverified claims
        run: |
          python scripts/audit_catalog.py --output artifacts/catalog-quality.json
          python scripts/catalog_integrity.py --output artifacts/catalog-integrity.json
      - name: Capture phone, tablet and desktop preview
        run: python scripts/capture_ui.py
      - name: Store UI screenshots for human review
        uses: actions/upload-artifact@v4
        with:
          name: kyiv-radar-visual-preview
          path: |
            artifacts/*.png
            artifacts/catalog-quality.json
            artifacts/catalog-integrity.json
          retention-days: 7
      - name: Test isolated user journeys, media privacy, moderation and responsive UI
        run: |
          python -m pytest -q \
            tests/test_isolated_staging.py \
            tests/test_moderation_callback_isolated.py \
            tests/test_moderation_atomic_resilience.py \
            tests/test_user_journeys_isolated.py \
            tests/test_privacy_and_media.py \
            tests/test_upload_body_limit.py \
            tests/test_smart_radar.py \
            tests/test_first_visit_v17.py \
            tests/test_favorites_v128.py \
            tests/test_favorites_shortcut_v129.py \
            tests/test_favorite_identity_v130.py \
            tests/test_public_catalog_outage_v131.py \
            tests/test_backend_public_source_gate_v132.py \
            tests/test_kyiv_signal_theme_v112.py \
            tests/test_smart_filters_v113.py \
            tests/test_room_consistency_browser_v134.py \
            tests/test_simple_first_view.py \
            tests/test_catalog_integrity_v116.py \
            tests/test_reviewer_queue_v117.py \
            tests/test_truthful_listing_ux_v118.py \
            tests/test_source_first_contact_v119.py \
            tests/test_landlord_consent_v121.py \
            tests/test_market_inventory_v122.py \
            tests/test_partner_xml_v123.py \
            tests/test_partner_yrl_v127a.py \
            tests/test_source_rights_v124.py \
            tests/test_partner_visibility_v125.py \
            tests/test_partner_publication_v126.py \
            tests/test_partner_fallback_browser_v125.py \
            tests/test_dim_ria_discovery_v122.py \
            tests/test_unverified_metro_v120.py \
            tests/test_rental_safety_v116.py \
            tests/test_listing_light_contrast_v116.py \
            tests/test_catalog_claims.py \
            tests/test_listing_trust_v18.py \
            tests/test_trust_experience_v18.py \
            tests/test_vps_release_snapshot.py \
            tests/test_public_catalog_privacy.py \
            tests/test_photo_swipe.py \
            tests/test_modal_photo_fallback_v132.py \
            tests/test_listing_contact_v115.py \
            tests/test_send_contact_ui.py
