name: Partner XML/YML importer checks

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/partner_xml.py"
      - "scripts/market_inventory.py"
      - "tests/test_partner_xml_v123.py"
      - "tests/test_market_inventory_v122.py"
      - ".github/workflows/partner-xml.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partner-xml-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (no application secrets or network feed calls)
        run: python -m pip install pytest
      - name: Compile strict parser
        run: python -m compileall -q scripts/partner_xml.py scripts/market_inventory.py
      - name: Run XML and legacy bulk intake regression tests
        run: python -m pytest -q tests/test_partner_xml_v123.py tests/test_market_inventory_v122.py
