name: Open-data read-only probe
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/prozorro_probe.py
      - scripts/prozorro_incremental_scan.py
      - scripts/prozorro_review_cache.py
      - scripts/prozorro_review_sync.py
      - scripts/prozorro_auction_candidates.py
      - .github/workflows/prozorro-probe.yml
permissions:
  contents: read
concurrency:
  group: prozorro-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  public-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded public GET; print aggregate counts only
        run: python3 scripts/prozorro_probe.py --live-read-only --limit 3

      - name: Bounded three-page incremental diagnostic
        run: python3 scripts/prozorro_incremental_scan.py --live-read-only

      - name: Live feed to disposable private SQLite (aggregate only)
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf -- "$dir"' EXIT
          chmod 700 "$dir"
          python3 -m scripts.prozorro_review_sync --live-private-review --private-dir "$dir"
